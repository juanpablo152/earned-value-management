services:
  postgres:
    image: postgres:17-alpine
    container_name: evm-postgres
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-evm_db}
      POSTGRES_USER: ${POSTGRES_USER:-evm_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-evm_password}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - evm_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-evm_user} -d ${POSTGRES_DB:-evm_db}"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: evm-backend
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB:-evm_db}
      SPRING_DATASOURCE_USERNAME: ${POSTGRES_USER:-evm_user}
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD:-evm_password}
      SPRING_JPA_DDL_AUTO: update
    ports:
      - "${SERVER_PORT:-8080}:8080"
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  evm_pgdata:
