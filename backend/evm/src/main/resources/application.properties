spring.application.name=evm

# Database
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/evm_db}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:evm_user}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:evm_password}
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA
spring.jpa.hibernate.ddl-auto=${SPRING_JPA_DDL_AUTO:update}
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=false

# Server
server.port=${SERVER_PORT:8080}
