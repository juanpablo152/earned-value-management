<div class="mx-auto px-4 sm:px-6 lg:px-8 py-8">
  <div class="mb-6">
    <a routerLink="/projects" class="text-sm text-indigo-600 hover:text-indigo-800 no-underline flex items-center gap-1">
      <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 19l-7-7 7-7" />
      </svg>
      Volver a Proyectos
    </a>
  </div>

  @if (loading()) {
    <div class="flex justify-center py-16">
      <div class="animate-spin rounded-full h-10 w-10 border-b-2 border-indigo-600"></div>
    </div>
  } @else if (project(); as p) {
    <div class="mb-8">
      <div class="flex items-start justify-between">
        <div>
          <h1 class="text-2xl font-bold text-slate-800">{{ p.name }}</h1>
          @if (p.description) {
            <p class="text-sm text-slate-500 mt-1">{{ p.description }}</p>
          }
          <p class="text-xs text-slate-400 mt-2">Ultima actualización {{ p.updatedAt | date:'medium' }}</p>
        </div>
        <a [routerLink]="['/projects', p.id, 'edit']"
           class="text-sm text-indigo-600 hover:text-indigo-800 no-underline font-medium">
          Editar Proyecto
        </a>
      </div>
    </div>

    @if (p.activities.length > 0) {
      <div class="space-y-6">
        <app-consolidated-indicators [indicators]="p.consolidatedIndicators" />
        <app-evm-chart [activities]="p.activities" />
        <app-activity-table
          [projectId]="p.id"
          [activities]="p.activities"
          (deleteActivity)="onDeleteActivity($event)" />
      </div>
    } @else {
      <app-activity-table
        [projectId]="p.id"
        [activities]="p.activities"
        (deleteActivity)="onDeleteActivity($event)" />
    }
  }
</div>
