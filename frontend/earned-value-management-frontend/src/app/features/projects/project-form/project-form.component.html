<div class="max-w-2xl mx-auto px-4 sm:px-6 lg:px-8 py-8">
  <div class="mb-6">
    <a routerLink="/projects" class="text-sm text-indigo-600 hover:text-indigo-800 no-underline flex items-center gap-1">
      <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 19l-7-7 7-7" />
      </svg>
      Volver a Proyectos
    </a>
  </div>

  <div class="bg-white rounded-xl border border-slate-200 p-8">
    <h1 class="text-2xl font-bold text-slate-800 mb-6">
      {{ isEditMode() ? 'Editar Proyecto' : 'Nuevo Proyecto' }}
    </h1>

    <form [formGroup]="form" (ngSubmit)="onSubmit()">
      <div class="space-y-5">
        <div>
          <label for="name" class="block text-sm font-medium text-slate-700 mb-1">Nombre del Proyecto *</label>
          <input id="name" formControlName="name" type="text"
                 class="w-full px-3 py-2.5 rounded-lg border border-slate-300 text-slate-800 text-sm focus:ring-2 focus:ring-indigo-500 focus:border-indigo-500 outline-none transition-colors"
                 placeholder="Ingrese el nombre del proyecto">
          @if (validation.getError(form.get('name')); as error) {
            <p class="mt-1 text-xs text-red-600">{{ error }}</p>
          }
        </div>

        <div>
          <label for="description" class="block text-sm font-medium text-slate-700 mb-1">Descripcion</label>
          <textarea id="description" formControlName="description" rows="4"
                    class="w-full px-3 py-2.5 rounded-lg border border-slate-300 text-slate-800 text-sm focus:ring-2 focus:ring-indigo-500 focus:border-indigo-500 outline-none transition-colors resize-none"
                    placeholder="Ingrese una descripcion (opcional)"></textarea>
        </div>
      </div>

      <div class="flex items-center gap-3 mt-8">
        <button type="submit"
                [disabled]="form.invalid || submitting()"
                class="bg-indigo-600 text-white px-6 py-2.5 rounded-lg text-sm font-medium hover:bg-indigo-700 disabled:opacity-50 disabled:cursor-not-allowed transition-colors">
          {{ submitting() ? 'Guardando...' : (isEditMode() ? 'Actualizar Proyecto' : 'Crear Proyecto') }}
        </button>
        <a routerLink="/projects"
           class="text-slate-600 hover:text-slate-800 px-4 py-2.5 text-sm font-medium no-underline">
          Cancelar
        </a>
      </div>
    </form>
  </div>
</div>
